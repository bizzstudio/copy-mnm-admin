# SPA static serving (React Router / client-side routing)
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # block search engines from indexing this app
    add_header X-Robots-Tag "noindex, nofollow" always;

    # gzip
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml application/wasm;

    # ה-API חייב להגיע ל-backend לפני שה-fallback של ה-SPA תופס אותו.
    #
    # ה-baseURL של האפליקציה הוא same-origin ("/api"), ולכן בלי הבלוק הזה
    # POST /api/auth/login נופל ל-`location /` ומקבל index.html בתשובה עם
    # סטטוס 200. axios לא רואה שגיאה, ה-caller מקבל מחרוזת HTML במקום אובייקט,
    # ו-`res.token` הוא undefined — כלומר ההתחברות פשוט לא עושה כלום, בשקט.
    #
    # `Host $host` הוא לא נוי: `resolveTenant()` בשרת מזהה את הלקוח לפי שם
    # ה-host של הבקשה. אם נשלח את ה-host של ה-upstream, אין tenant, וכל
    # התחברות תיפול על 404.
    location /api/ {
        # חייב להתאים ל-PORT של mnm-backend (ברירת המחדל שם היא 5000)
        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # socket.io / SSE על אותו origin
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # ייבוא קבצים והורדות ZIP גדולות
        client_max_body_size 50m;
        proxy_read_timeout   600s;
    }

    # assets עם hash — cache ארוך.
    # הנתיב הוא /@/assets/ ולא /assets/, כי vite.config.js מגדיר
    # `assetsDir: "@/assets"`. עם /assets/ הבלוק הזה לא היה תופס כלום
    # וכל ה-JS נמסר בלי cache.
    location /@/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header לא עובר בירושה כשמוגדר מקומית — צריך לחזור עליו
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # כל נתיב לא-קיים → index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # אל תאחסן את index.html ב-cache (כדי שעדכונים ייתפסו מיד)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
