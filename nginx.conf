# SPA static serving (React Router / client-side routing)
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # block search engines from indexing this app
    add_header X-Robots-Tag "noindex, nofollow" always;

    # gzip
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml application/wasm;

    # assets עם hash — cache ארוך
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header לא עובר בירושה כשמוגדר מקומית — צריך לחזור עליו
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # כל נתיב לא-קיים → index.html (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # אל תאחסן את index.html ב-cache (כדי שעדכונים ייתפסו מיד)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
